allowBuilds:
  # Only the babel runtime behind the ESLint language server, which the tests spawn as a command.
  core-js: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
    # twoslash asks for typescript ^5.5 || ^6. The repository is on 7, and twoslash gets its
    # compiler through the `typescript-5` alias instead.
    typescript: "*"
