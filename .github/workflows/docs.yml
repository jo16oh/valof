name: Docs

# Own workflow, not a job in CI: it runs only when the book can break. The `main` ruleset requires
# no status check, so a run that never starts blocks nothing.
on:
  push:
    branches: [main]
    # GitHub Actions does not expand YAML anchors, so this list is repeated below.
    paths:
      - "docs/**"
      - "mise.toml"
      - "mise.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mise.toml"
      - "mise.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same build the release runs, so a broken book fails the PR and not the tag.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: true

      # mdbook and mdbook-linkcheck2, pinned in mise.toml.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - run: vp install

      - run: vp run docs:build
