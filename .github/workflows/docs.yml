name: Docs

# Own workflow, not a job in CI: it runs only when the book can break. The `main` ruleset requires
# no status check, so a run that never starts blocks nothing.
on:
  push:
    branches: [main]
    # GitHub Actions does not expand YAML anchors, so this list is repeated below.
    paths:
      - "docs/**"
      - "mise.toml"
      - "mise.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mise.toml"
      - "mise.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The same build the release runs, so a broken book fails the PR and not the tag.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true

      # mdbook and mdbook-linkcheck2, pinned in mise.toml.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - run: vp install

      - run: vp run docs:build
