name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # needed to check the tag is an ancestor of main

      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: "24"
          cache: true
          registry-url: "https://registry.npmjs.org"

      # setup-vp puts `vp` on PATH but not pnpm, which the publish step needs.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - run: vp install

      - run: vp check

      - run: vp test

      - run: vp run size

      - name: Verify tag is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD ||
            { echo "tag $GITHUB_REF_NAME is not reachable from main"; exit 1; }

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }

      # --no-git-checks: the tag is checked out detached, not on the publish branch.
      - run: pnpm publish --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
