name: Release

# Merging a release PR bumps this file; the run releases whatever version main carries that has no tag yet.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the commit's PR is looked up below
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      due: ${{ steps.tag.outputs.due }}
      body: ${{ steps.pr.outputs.body }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Resolve tag
        id: tag
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # ls-remote exits 2 when the tag is absent; any other failure must not pass for "absent".
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || status=$?
          case $status in
            0) echo "::notice::$tag already exists; nothing to release"; echo "due=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "due=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      # A version bump that did not come through `vp run bump-version` stops here instead of releasing.
      - name: Verify commit is a merged release PR
        id: pr
        if: steps.tag.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -e --arg tag "$TAG" 'first(.[] | select(
              .merged_at != null
              and .head.repo.full_name == .base.repo.full_name
              and .head.ref == "chore/release-\($tag[1:])"
              and .title == "chore: release \($tag)"))')" ||
            { echo "::error::$GITHUB_SHA is not a merged chore/release-${TAG#v} PR titled \"chore: release $TAG\""; exit 1; }
          # A random delimiter, so no line of the body can end the output early.
          delimiter="EOF_$(openssl rand -hex 16)"
          { echo "body<<$delimiter"; jq -r '.body // ""' <<< "$pr"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

  release:
    needs: verify
    if: needs.verify.outputs.due == 'true'
    runs-on: ubuntu-latest
    environment: release # holds the deploy key that creates the tag
    permissions:
      contents: write # the release is created below
      id-token: write # npm trusted publishing and provenance
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # No cache in this workflow: a cache another ref wrote must not reach what a release publishes.
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # setup-vp puts `vp` on PATH but not pnpm, which the publish step needs.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.25.0

      - run: vp install

      - run: vp check

      - run: vp test

      - run: vp run replace-bundle-size-claims README.md docs/src/introduction.md package.json

      - run: vp run type-perf

      - run: vp run ts-compatibility

      # Tags are immutable, so tagging only after the checks pass keeps a broken commit from burning
      # its version. Only deploy keys may create tags (the `tags` ruleset), so the push goes over SSH
      # with the `release` environment's key; the agent holding it ends with this step, and the key
      # never hits disk.
      - name: Create tag
        run: |
          eval "$(ssh-agent -s)" > /dev/null
          trap 'ssh-agent -k > /dev/null' EXIT
          ssh-add -q - <<< "$RELEASE_TAG_KEY"
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com \(.)"' > "$RUNNER_TEMP/known_hosts"
          git -c core.sshCommand="ssh -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
            push "git@github.com:$GITHUB_REPOSITORY.git" "$GITHUB_SHA:refs/tags/$TAG"
        env:
          RELEASE_TAG_KEY: ${{ secrets.RELEASE_TAG_KEY }}

      # No token: npm trusts this workflow through OIDC. --no-git-checks: the verify job already
      # checked this commit.
      - run: pnpm publish --provenance --no-git-checks

      # Last: a release pointing at a version npm rejected would be a lie. The notes open with the
      # release PR's body, followed by the PRs merged since the previous tag, grouped by
      # `.github/release.yml`.
      - name: Create the GitHub release
        run: gh release create "$TAG" --verify-tag --notes "$BODY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ needs.verify.outputs.body }}

  # The book is published per tag under `{tag}/`, with `latest/` a copy of the newest release and a
  # bare index at the root. The site lives on `gh-pages`, which GitHub Pages serves as a branch.
  docs:
    needs: [verify, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the site is pushed to gh-pages
    concurrency:
      group: gh-pages # two releases must not push the site at once
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"

      # mdbook and mdbook-linkcheck2, pinned in mise.toml.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false

      - run: vp install

      - run: vp run docs:build

      - name: Check out the published site
        run: |
          if git fetch --quiet origin gh-pages; then
            git worktree add site FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages site
          fi

      - name: Add this version
        run: |
          rm -rf "site/$TAG"
          cp -r docs/book/html "site/$TAG"
          # A prerelease is reachable by its tag, but it is not what `latest/` means.
          case "$TAG" in
            *-*) ;;
            *) rm -rf site/latest && cp -r docs/book/html site/latest ;;
          esac
          node docs/tools/version-index/index.ts site
          touch site/.nojekyll

      # The checkout keeps no credentials, so the token reaches this step alone and not the
      # dependencies `vp install` runs.
      - name: Push the site
        run: |
          git -C site add --all
          git -C site -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --message "docs: publish $TAG"
          git -C site push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
