name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true

      - run: vp install

      - run: vp check

      - run: vp test

      - run: vp run bundle-size

      - run: vp run replace-bundle-size-claims docs/src/introduction.md

      # Merging a release PR releases it, so the claims it ships are checked before then.
      - if: startsWith(github.head_ref, 'chore/release-')
        run: vp run replace-bundle-size-claims README.md package.json

      - run: vp run type-perf

      - if: "!startsWith(github.head_ref, 'chore/release-')"
        run: vp run ts-compatibility

      # The scripts catch up with the API before a release, not after it.
      - if: startsWith(github.head_ref, 'chore/release-')
        run: vp run ts-compatibility --require-pin

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The versions pinned in mise.toml, so CI lints with the ones the hook runs.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: actionlint shellcheck zizmor

      - run: actionlint

      # The token enables the audits that query GitHub, such as known-vulnerable actions.
      - run: zizmor .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
