name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: true

      - run: vp install

      - run: vp check

      - run: vp test

      # Merging a release PR releases it, so --release runs here first. It checks the claims the
      # release ships, and fails until the scripts are updated to the current API, so they are
      # updated before a release, not after it.
      - run: vp run check-dist ${RELEASE:+"$RELEASE"}
        env:
          RELEASE: ${{ startsWith(github.head_ref, 'chore/release-') && '--release' || '' }}

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The versions pinned in mise.toml, so CI lints with the ones the hook runs.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: actionlint shellcheck zizmor

      - run: actionlint

      # The token enables the audits that query GitHub, such as known-vulnerable actions.
      - run: zizmor .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
