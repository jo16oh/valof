<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Valof documentation" />
    <title>Valof</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/core.min.css"
    />
  </head>
  <body>
    <div id="app">Loading…</div>
    <script>
      window.$docsify = {
        auto2top: true,
        loadSidebar: true,
        name: "Valof",
        subMaxLevel: 2,
        shiki: {
          theme: "github-light",
          url: "https://esm.run/shiki@3/bundle/web",
          langs: ["html", "css", "javascript", "typescript", "bash"],
          warnOnError: true,
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0"></script>

    <script src="//cdn.jsdelivr.net/npm/@sy-records/docsify-shiki@1/dist/index.min.js"></script>
  </body>
</html>
